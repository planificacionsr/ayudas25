<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Librerías qgis2web -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <!-- Estilos personalizados -->
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Controles del mapa */
        .ol-control > * {
            border-radius: 6px !important;
            padding: 3px 6px !important;
            background-color: rgba(255,255,255,0.9) !important;
            color: #444 !important;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(230,230,230,0.9) !important;
        }

        /* Popup */
        .ol-popup {
            background-color: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            min-width: 180px;
            font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .ol-popup-closer {
            color: #444;
            font-weight: bold;
        }

        /* Título flotante */
        #map-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        /* Responsive */
        @media (max-width: 600px) {
            #map-title {
                font-size: 13px;
                padding: 4px 10px;
            }
        }
    </style>

    <title>Visor Censo Santa Rosa 2025</title>
</head>
<body>
    <div id="map">
        <div id="map-title">Ayudas económicas Ene–Ago 2025</div>
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- Scripts de qgis2web -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>

    <!-- Capas -->
    <script src="layers/Limites_1.js"></script>
    <script src="layers/Barrios_2.js"></script>
    <script src="layers/Espaciosverdes_3.js"></script>
    <script src="layers/Redvial_4.js"></script>
    <script src="layers/Parcelarioconpropietarios_5.js"></script>
    <script src="layers/Ayudasporlocalidad_6.js"></script>
    <script src="layers/EmpleadosMunicipales_7.js"></script>
    <script src="layers/Cantidaddeayudasporpersona_8.js"></script>
    <script src="layers/Ayudasportipo_9.js"></script>
    <script src="layers/Ayudaspormonto_10.js"></script>
    <script src="layers/Montoporlocalidad_11.js"></script>
    <script src="layers/Localidades_12.js"></script>

    <!-- Estilos -->
    <script src="styles/Limites_1_style.js"></script>
    <script src="styles/Barrios_2_style.js"></script>
    <script src="styles/Espaciosverdes_3_style.js"></script>
    <script src="styles/Redvial_4_style.js"></script>
    <script src="styles/Parcelarioconpropietarios_5_style.js"></script>
    <script src="styles/Ayudasporlocalidad_6_style.js"></script>
    <script src="styles/EmpleadosMunicipales_7_style.js"></script>
    <script src="styles/Cantidaddeayudasporpersona_8_style.js"></script>
    <script src="styles/Ayudasportipo_9_style.js"></script>
    <script src="styles/Ayudaspormonto_10_style.js"></script>
    <script src="styles/Montoporlocalidad_11_style.js"></script>
    <script src="styles/Localidades_12_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script> 
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>
</body>
</html>
